
name: Build SunPad Game Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout SunPad
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config ripgrep

      - name: Download game ISO
        env:
          ISO_URL: ${{ secrets.ISO_URL }}
        run: |
          test -n "$ISO_URL"
          curl --fail --location --retry 3 \
            --silent --show-error \
            --output "$RUNNER_TEMP/GMSE01.iso" \
            "$ISO_URL"
          ls -lh "$RUNNER_TEMP/GMSE01.iso"

      - name: Verify game revision
        run: |
          echo "Downloaded ISO SHA-256:"
          shasum -a 256 "$RUNNER_TEMP/GMSE01.iso"

      - name: Prepare game
        run: |
          ./scripts/prepare-game.sh \
            "$RUNNER_TEMP/GMSE01.iso"

      - name: Compile iOS module
        run: |
          ./scripts/ios-build-core-device.sh

      - name: Upload compiled module
        uses: actions/upload-artifact@v4
        with:
          name: SunPad-Compiled-Module
          path: build/ios-module-device/gGMSE01_recomp.dylib
          if-no-files-found: error
          retention-days: 1
